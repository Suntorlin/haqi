<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<title>语音转文字</title>
<style>
/* Tokens and scales copied from HAQI web (web/DESIGN.md, web/src/index.css). */
:root {
    --social-fg: #09090b; --social-fg-muted: #71717a; --social-fg-subtle: #a1a1aa;
    --social-surface: #ffffff; --social-muted: #f4f4f5; --social-hover: #f8f8f9;
    --social-border: #e4e4e7; --social-divider: #f0f0f2;
    --social-primary: #18181b; --social-primary-fg: #fafafa;
    --social-success: #10b981; --social-badge: #ff3040; --social-danger: #e5484d;
    --social-on-accent: #ffffff; --social-bar-bg: rgba(255, 255, 255, 0.86);
    --shadow-float: 0 8px 28px rgba(0, 0, 0, 0.12);
    --motion-fast: 150ms; --motion-ease: cubic-bezier(.2, 0, 0, 1);
    color-scheme: light;
}
@media (prefers-color-scheme: dark) {
    :root {
        --social-fg: #fafafa; --social-fg-muted: #a1a1aa; --social-fg-subtle: #71717a;
        --social-surface: #09090b; --social-muted: #1c1c1f; --social-hover: #141416;
        --social-border: #27272a; --social-divider: #1c1c1f;
        --social-primary: #fafafa; --social-primary-fg: #09090b;
        --social-success: #34d399; --social-danger: #ff6369;
        --social-bar-bg: rgba(9, 9, 11, 0.86);
        --shadow-float: 0 8px 28px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
    }
}
* { box-sizing: border-box; margin: 0; }
html {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--social-surface); color: var(--social-fg);
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
    scrollbar-width: none;
}
::-webkit-scrollbar { display: none; }
body { min-height: 100dvh; display: flex; flex-direction: column; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--social-fg-subtle); outline-offset: 2px; }

.caption { font-size: .75rem; }
.footnote { font-size: .8125rem; }
.body { font-size: .9375rem; }
.headline { font-size: 1rem; }
.title { font-size: 1.25rem; }
.semibold { font-weight: 600; }
.muted { color: var(--social-fg-muted); }
.subtle { color: var(--social-fg-subtle); }
.hidden { display: none !important; }

header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background: var(--social-bar-bg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--social-divider);
}
header h1 { flex: 1; min-width: 0; font-size: 1rem; font-weight: 600; }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 9999px; background: var(--social-muted); font-size: .75rem; color: var(--social-fg-muted); white-space: nowrap; }
.badge .dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--social-fg-subtle); }
.badge.ok .dot { background: var(--social-success); }
.badge.bad .dot { background: var(--social-danger); }

main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 24px 16px calc(env(safe-area-inset-bottom) + 32px); display: flex; flex-direction: column; gap: 24px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 9999px; font-size: .9375rem; transition: opacity var(--motion-fast) var(--motion-ease), transform var(--motion-fast) var(--motion-ease), background-color var(--motion-fast) var(--motion-ease); }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn-primary { background: var(--social-primary); color: var(--social-primary-fg); font-weight: 600; }
.btn-secondary { background: var(--social-muted); color: var(--social-fg); }
.btn-ghost { color: var(--social-fg-muted); }
.btn-ghost:hover { background: var(--social-muted); color: var(--social-fg); }
.btn-sm { height: 36px; padding: 0 16px; font-size: .8125rem; }
.btn-xs { position: relative; height: 28px; padding: 0 12px; font-size: .8125rem; }
.btn-xs::after { content: ''; position: absolute; inset: -8px; }

.field { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--social-border); background: var(--social-surface); color: var(--social-fg); font: inherit; font-size: 16px; outline: none; transition: border-color var(--motion-fast) var(--motion-ease); }
.field:focus { border-color: var(--social-fg-subtle); }
.field::placeholder { color: var(--social-fg-subtle); }
.field-pill { border: 0; border-radius: 9999px; background: var(--social-muted); padding: 0 16px; }
label.caption { display: block; margin: 0 4px 6px; color: var(--social-fg-muted); }

.card { border: 1px solid var(--social-border); border-radius: 16px; background: var(--social-surface); }

/* Login */
#login { display: flex; flex-direction: column; gap: 16px; padding: 24px 20px; }
#login p { line-height: 1.5; }
.error { color: var(--social-danger); }

/* Recorder */
#recorder { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 16px 0 8px; }
.mic {
    width: 96px; height: 96px; border-radius: 9999px;
    display: grid; place-items: center;
    background: var(--social-primary); color: var(--social-primary-fg);
    transition: transform var(--motion-fast) var(--motion-ease), background-color 200ms var(--motion-ease);
}
.mic:active:not(:disabled) { transform: scale(.96); }
.mic svg { width: 36px; height: 36px; }
.mic.recording { background: var(--social-badge); color: var(--social-on-accent); }
.mic-wrap { position: relative; display: grid; place-items: center; }
.mic-wrap .pulse { position: absolute; inset: -10px; border-radius: 9999px; border: 2px solid var(--social-badge); opacity: 0; pointer-events: none; }
.mic-wrap.recording .pulse { animation: pulse 1.6s var(--motion-ease) infinite; }
@keyframes pulse { 0% { transform: scale(.9); opacity: .6; } 100% { transform: scale(1.25); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mic-wrap.recording .pulse { animation: none; opacity: .5; } }
#timer { font-variant-numeric: tabular-nums; min-height: 1.5em; text-align: center; }
.row { display: flex; align-items: center; gap: 8px; }
.row-center { justify-content: center; }

.spinner { width: 16px; height: 16px; border-radius: 9999px; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Results */
#results { display: flex; flex-direction: column; gap: 12px; }
.section-title { margin: 0 4px; font-size: .75rem; letter-spacing: .04em; color: var(--social-fg-muted); }
.result { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 8px; }
.result .text { font-size: 1rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; user-select: text; }
.result .text.empty { color: var(--social-fg-subtle); }
.result .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .8125rem; color: var(--social-fg-muted); font-variant-numeric: tabular-nums; }
.result .actions { display: flex; gap: 4px; margin-left: -8px; }
.result audio { width: 100%; height: 36px; }
.result.pending .text { color: var(--social-fg-muted); display: flex; align-items: center; gap: 8px; }
.result.failed .text { color: var(--social-danger); }
.empty-state { padding: 8px 4px; font-size: .8125rem; color: var(--social-fg-subtle); }
</style>
</head>
<body>
<header>
    <h1>语音转文字</h1>
    <span id="status" class="badge"><span class="dot"></span><span id="status-text">连接中</span></span>
</header>

<main>
    <section id="login" class="card hidden">
        <div>
            <div class="title semibold">登录</div>
            <p class="body muted" style="margin-top:6px">用 HAQI 的 access token 登录，和 HAQI 网页一样。</p>
        </div>
        <form id="login-form" class="row" style="flex-direction:column;align-items:stretch;gap:12px">
            <input id="token" class="field" type="password" placeholder="Access token" autocomplete="current-password" required>
            <button class="btn btn-primary" type="submit">登录</button>
            <div id="login-error" class="footnote error hidden"></div>
        </form>
    </section>

    <section id="app" class="hidden" style="display:flex;flex-direction:column;gap:24px">
        <div id="recorder">
            <div class="mic-wrap" id="mic-wrap">
                <span class="pulse"></span>
                <button id="mic" class="mic" type="button" aria-label="开始录音">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/></svg>
                </button>
            </div>
            <div id="timer" class="headline">点一下开始说话</div>
            <div class="row row-center">
                <button id="cancel" class="btn btn-ghost btn-sm hidden" type="button">取消</button>
                <button id="upload" class="btn btn-ghost btn-sm" type="button">上传音频文件</button>
                <input id="file" type="file" accept="audio/*,video/*" class="hidden">
            </div>
        </div>

        <div>
            <label class="caption" for="hotwords">热词（可选，用逗号分隔）</label>
            <input id="hotwords" class="field field-pill" type="text" placeholder="例如：HAQI, Claude, worktree" autocomplete="off">
        </div>

        <div id="results">
            <div class="section-title">识别结果</div>
            <div id="empty" class="empty-state">还没有结果。</div>
        </div>
    </section>
</main>

<script>
(() => {
    const TOKEN_KEY = 'asr_access_token'
    const HOTWORDS_KEY = 'asr_hotwords'
    const MIME_CANDIDATES = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus']
    const MAX_MS = 5 * 60_000
    const $ = (id) => document.getElementById(id)

    let jwt = null
    let recorder = null
    let stream = null
    let chunks = []
    let startedAt = 0
    let timer = null
    let discard = false

    // ---- Auth (same flow as HAQI web: access token -> short-lived JWT) ----
    async function login(accessToken) {
        const res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ accessToken })
        })
        if (!res.ok) throw new Error(res.status === 401 ? 'token 不对' : `登录失败（HTTP ${res.status}）`)
        const data = await res.json()
        jwt = data.token
    }

    async function api(path, init = {}, retried = false) {
        const res = await fetch(path, { ...init, headers: { ...(init.headers || {}), authorization: `Bearer ${jwt}` } })
        if (res.status === 401 && !retried && localStorage.getItem(TOKEN_KEY)) {
            await login(localStorage.getItem(TOKEN_KEY))
            return api(path, init, true)
        }
        return res
    }

    function setStatus(kind, text) {
        $('status').className = `badge ${kind}`
        $('status-text').textContent = text
    }

    async function refreshStatus() {
        try {
            const res = await api('/api/voice/dictation')
            const data = await res.json()
            if (data.available) {
                setStatus('ok', data.model.replace(/^.*\//, '').replace(/-8bit$/, ''))
            } else {
                setStatus('bad', '模型加载中')
                setTimeout(refreshStatus, 3000)
            }
        } catch {
            setStatus('bad', '服务不可用')
        }
    }

    function showApp() {
        $('login').classList.add('hidden')
        $('app').classList.remove('hidden')
        refreshStatus()
    }

    function showLogin(message) {
        $('app').classList.add('hidden')
        $('login').classList.remove('hidden')
        setStatus('', '未登录')
        if (message) {
            $('login-error').textContent = message
            $('login-error').classList.remove('hidden')
        }
    }

    $('login-form').addEventListener('submit', async (event) => {
        event.preventDefault()
        const value = $('token').value.trim()
        if (!value) return
        $('login-error').classList.add('hidden')
        try {
            await login(value)
            localStorage.setItem(TOKEN_KEY, value)
            $('token').value = ''
            showApp()
        } catch (error) {
            showLogin(error.message)
        }
    })

    // ---- Recording ----
    function pickMime() {
        if (typeof MediaRecorder === 'undefined' || !MediaRecorder.isTypeSupported) return undefined
        return MIME_CANDIDATES.find((type) => MediaRecorder.isTypeSupported(type))
    }

    function fmt(ms) {
        const s = Math.floor(ms / 1000)
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
    }

    function setRecordingUi(on) {
        $('mic').classList.toggle('recording', on)
        $('mic-wrap').classList.toggle('recording', on)
        $('mic').setAttribute('aria-label', on ? '结束录音' : '开始录音')
        $('cancel').classList.toggle('hidden', !on)
        $('upload').classList.toggle('hidden', on)
        $('timer').textContent = on ? `正在听 0:00` : '点一下开始说话'
    }

    async function start() {
        if (!window.MediaRecorder || !navigator.mediaDevices?.getUserMedia) {
            $('timer').textContent = '这个浏览器不能录音'
            return
        }
        $('mic').disabled = true
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
        } catch (error) {
            $('mic').disabled = false
            $('timer').textContent = error && error.name === 'NotAllowedError' ? '没有麦克风权限，请在浏览器设置里允许' : '打不开麦克风'
            return
        }
        const mimeType = pickMime()
        recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined)
        chunks = []
        discard = false
        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data) }
        recorder.onstop = () => {
            stream.getTracks().forEach((t) => t.stop())
            stream = null
            clearInterval(timer)
            const blob = new Blob(chunks, { type: recorder.mimeType || mimeType || 'audio/webm' })
            const seconds = (Date.now() - startedAt) / 1000
            recorder = null
            setRecordingUi(false)
            if (!discard && blob.size > 0) transcribe(blob, `录音 ${seconds.toFixed(1)} 秒`)
        }
        recorder.start()
        startedAt = Date.now()
        setRecordingUi(true)
        $('mic').disabled = false
        timer = setInterval(() => {
            const ms = Date.now() - startedAt
            $('timer').textContent = `正在听 ${fmt(ms)}`
            if (ms >= MAX_MS) recorder?.stop()
        }, 250)
    }

    $('mic').addEventListener('click', () => {
        if (recorder) recorder.stop()
        else start()
    })
    $('cancel').addEventListener('click', () => {
        discard = true
        recorder?.stop()
    })
    $('upload').addEventListener('click', () => $('file').click())
    $('file').addEventListener('change', () => {
        const file = $('file').files[0]
        if (file) transcribe(file, file.name)
        $('file').value = ''
    })

    // ---- Transcription ----
    const hotwordsInput = $('hotwords')
    hotwordsInput.value = localStorage.getItem(HOTWORDS_KEY) || ''
    hotwordsInput.addEventListener('change', () => localStorage.setItem(HOTWORDS_KEY, hotwordsInput.value))

    function el(tag, className, text) {
        const node = document.createElement(tag)
        if (className) node.className = className
        if (text !== undefined) node.textContent = text
        return node
    }

    async function transcribe(blob, source) {
        $('empty')?.remove()
        const card = el('div', 'card result pending')
        const text = el('div', 'text')
        text.append(el('span', 'spinner'), document.createTextNode('正在转成文字…'))
        const meta = el('div', 'meta')
        meta.append(el('span', '', source), el('span', '', `${(blob.size / 1024).toFixed(0)} KB`))
        card.append(text, meta)
        $('results').insertBefore(card, $('results').children[1] || null)

        const hotwords = hotwordsInput.value.split(/[,，\n]/).map((w) => w.trim()).filter(Boolean)
        const query = hotwords.length ? `?hotwords=${encodeURIComponent(hotwords.join(','))}` : ''
        const t0 = performance.now()
        try {
            const res = await api(`/api/voice/transcribe${query}`, {
                method: 'POST',
                headers: { 'content-type': blob.type || 'application/octet-stream' },
                body: blob
            })
            const total = (performance.now() - t0) / 1000
            if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `HTTP ${res.status}`)
            const data = await res.json()
            card.className = 'card result'
            text.className = data.text ? 'text' : 'text empty'
            text.textContent = data.text || '（没有识别到文字）'
            meta.append(
                el('span', '', `识别 ${data.elapsedSeconds.toFixed(1)} 秒`),
                el('span', '', `总耗时 ${total.toFixed(1)} 秒`)
            )
            const actions = el('div', 'actions')
            const copy = el('button', 'btn btn-ghost btn-xs', '复制')
            copy.type = 'button'
            copy.addEventListener('click', async () => {
                await navigator.clipboard.writeText(data.text)
                copy.textContent = '已复制'
                setTimeout(() => { copy.textContent = '复制' }, 1500)
            })
            const play = el('button', 'btn btn-ghost btn-xs', '回放')
            play.type = 'button'
            play.addEventListener('click', () => {
                const audio = el('audio')
                audio.controls = true
                audio.src = URL.createObjectURL(blob)
                card.insertBefore(audio, actions)
                audio.play().catch(() => {})
                play.remove()
            })
            actions.append(copy, play)
            card.append(actions)
        } catch (error) {
            card.className = 'card result failed'
            text.textContent = `转文字失败：${error.message}`
        }
    }

    // ---- Boot ----
    const saved = localStorage.getItem(TOKEN_KEY)
    if (!saved) {
        showLogin()
    } else {
        login(saved).then(showApp).catch((error) => {
            localStorage.removeItem(TOKEN_KEY)
            showLogin(error.message)
        })
    }
})()
</script>
</body>
</html>
