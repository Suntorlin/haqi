name: Public safety

# This repo is public. Fail when a push or pull request adds a secret, a
# private host, a personal path, or a file that must not be committed.
# Same checks as the local git hooks: scripts/safety/check-public-safety.ts.

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    scan:
        runs-on: ubuntu-24.04
        env:
            # Private names to block, kept out of the public repo (comma separated).
            PUBLIC_SAFETY_PRIVATE_TERMS: ${{ secrets.PUBLIC_SAFETY_PRIVATE_TERMS }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: oven-sh/setup-bun@v2
            - name: Install gitleaks
              env:
                  GITLEAKS_VERSION: 8.30.1
              run: |
                  cd "$RUNNER_TEMP"
                  base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
                  curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                  curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep linux_x64.tar.gz | sha256sum -c -
                  tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
                  sudo install gitleaks /usr/local/bin/gitleaks
            - run: bun run safety:self-test
            - name: Check every tracked file
              run: bun run safety:check
            - name: Check the new commits
              env:
                  EVENT: ${{ github.event_name }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  BEFORE: ${{ github.event.before }}
                  AFTER: ${{ github.sha }}
              run: |
                  if [ "$EVENT" = pull_request ]; then
                      range="$PR_BASE..$PR_HEAD"
                  elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                      range="$BEFORE..$AFTER"
                  else
                      # New branch or force push: what isn't on the default branch yet.
                      range="$(git merge-base "$AFTER" origin/${{ github.event.repository.default_branch }})..$AFTER"
                  fi
                  echo "Checking $range"
                  bun scripts/safety/check-public-safety.ts --range "$range"
